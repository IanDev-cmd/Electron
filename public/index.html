<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kubertos checkout</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e4ddd2;
      --paper: #f6f1e8;
      --card: #fffdf9;
      --accent: #9a3412;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      color: var(--ink);
      background: var(--paper);
    }
    main {
      width: min(440px, calc(100% - 32px));
      margin: 48px auto;
      padding: 28px 28px 24px;
      background: var(--card);
      border: 1px solid var(--line);
    }
    p { color: var(--muted); line-height: 1.45; }
    .price {
      margin: 8px 0 0;
      font-size: 32px;
      letter-spacing: -0.03em;
    }
    .price span { font-size: 16px; color: var(--muted); letter-spacing: 0; }
    form { display: grid; gap: 14px; margin-top: 22px; }
    label { display: grid; gap: 6px; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: 16px/1.3 system-ui, sans-serif;
    }
    button {
      margin-top: 6px;
      padding: 12px 16px;
      border: 0;
      background: var(--accent);
      color: #fffaf5;
      font: 16px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { min-height: 1.4em; font-family: system-ui, sans-serif; font-size: 14px; }
    #status.error { color: #9f1239; }
    #status.ok { color: #166534; }
  </style>
</head>
<body>
  <main>
    <p id="plan">Kubertos</p>
    <p class="price" id="price">—</p>
    <form id="checkout">
      <label>Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>Cardholder name
        <input name="name" autocomplete="cc-name" required>
      </label>
      <label>Billing address
        <input name="billing" autocomplete="billing street-address">
      </label>
      <button type="submit" id="pay">Pay</button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script src="https://js.paystack.co/v2/inline.js"></script>
  <script>
    const form = document.getElementById('checkout');
    const statusEl = document.getElementById('status');
    const payBtn = document.getElementById('pay');
    const priceEl = document.getElementById('price');
    const planEl = document.getElementById('plan');

    function setStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind || '';
    }

    function money(amount, currency) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency }).format(amount / 100);
    }

    fetch('/api/config')
      .then(res => res.json())
      .then(cfg => {
        planEl.textContent = cfg.plan || 'Kubertos';
        priceEl.innerHTML = money(cfg.amount, cfg.currency) + ' <span>' + cfg.currency + '</span>';
        document.title = (cfg.plan || 'Checkout') + ' checkout';
      })
      .catch(() => setStatus('Could not load the checkout.', 'error'));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (typeof PaystackPop !== 'function') {
        setStatus('Payment form failed to load. Refresh and try again.', 'error');
        return;
      }
      payBtn.disabled = true;
      setStatus('Opening secure card payment…');
      const body = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch('/api/paystack/initialize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not start payment.');
        const popup = new PaystackPop();
        popup.resumeTransaction(data.access_code, {
          onSuccess: async (transaction) => {
            const check = await fetch('/api/paystack/verify/' + encodeURIComponent(transaction.reference));
            const result = await check.json();
            if (check.ok && result.status === 'paid') setStatus('Payment received. Reference ' + result.reference, 'ok');
            else setStatus(result.error || 'Payment was not confirmed.', 'error');
            payBtn.disabled = false;
          },
          onCancel: () => {
            setStatus('Payment cancelled.');
            payBtn.disabled = false;
          },
          onError: (err) => {
            setStatus(err.message || 'Payment could not be opened.', 'error');
            payBtn.disabled = false;
          },
        });
      } catch (err) {
        setStatus(err.message, 'error');
        payBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
